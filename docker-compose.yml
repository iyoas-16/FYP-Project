services:
  backend:
    build:
      context: .\backend
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_SCANS_TABLE: ${SUPABASE_SCANS_TABLE:-scans}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_ROLES: ${ADMIN_ROLES:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .\frontend
    env_file:
      - .env
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:5000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
